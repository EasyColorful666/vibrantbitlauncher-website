name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这几项才能发布 Pages：
#   pages: write  → 创建 / 更新 Pages 站点
#   id-token: write → deploy-pages 的 OIDC 校验
permissions:
  contents: read
  pages: write
  id-token: write

# 站点地址是 https://<user>.github.io/<repo>/，资源必须带 /<repo>/ 前缀，
# 否则 _nuxt/*、screens/*、favicon 全部 404。用自定义域名时改成 '/'。
env:
  NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

# 同一时间只跑一个发布，不要中途取消，避免线上站点被半成品覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package-lock.json 是在 Windows 上生成的，npm 会把它认作“非本平台”的 optional
      # 原生绑定裁掉（npm/cli#4828），于是 Linux runner 上 rollup 找不到
      # @rollup/rollup-linux-x64-gnu，直接 Cannot find module。
      # 这里按已装版本号把缺的两个补回来；在 Linux 上删锁重装可以永久解决。
      - name: Add missing linux native bindings
        run: |
          set -e
          ROLLUP_V=$(node -e "console.log(require('./node_modules/rollup/package.json').version)")
          DEPS="@rollup/rollup-linux-x64-gnu@${ROLLUP_V}"
          if [ -f node_modules/lightningcss/package.json ]; then
            LIGHT_V=$(node -e "console.log(require('./node_modules/lightningcss/package.json').version)")
            DEPS="$DEPS lightningcss-linux-x64-gnu@${LIGHT_V}"
          fi
          npm i --no-save --no-audit --no-fund $DEPS
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native binding ok')"

      - name: Generate static site
        run: npm run generate

      # enablement: true 允许 Action 在 Pages 尚未启用时自动创建站点（需要 pages: write）
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
