name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这几项才能发布 Pages：
#   pages: write   → 读取 / 更新 Pages 站点，并把产物挂上去
#   id-token: write → deploy-pages 的 OIDC 校验
permissions:
  contents: read
  pages: write
  id-token: write

# 已绑定自定义域名 vbl.easycolorful.cn，站点挂在根路径，baseURL 用默认的 '/'。
# 如果哪天去掉自定义域名、退回 https://<user>.github.io/<repo>/，把下面两行加回来：
# env:
#   NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

# 同一时间只跑一个发布，不要中途取消，避免线上站点被半成品覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先探一下 Pages 有没有启用，没有就立刻失败并给出人话提示，
      # 免得等 npm ci + 构建跑完才在 configure-pages 报一句 Not Found。
      # 注意：GITHUB_TOKEN 没有创建 Pages 站点的权限（configure-pages 的
      # enablement: true 会 403 Resource not accessible by integration），
      # 这一步只能由人在 Settings 里点一次。
      - name: Check Pages is enabled
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GET /repos/${{ github.repository }}/pages -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::仓库还没启用 Pages。打开 Settings → Pages → Build and deployment → Source，选「GitHub Actions」，再重新跑这个 workflow。私库需要 Pro/Team/Enterprise 套餐才有 Pages。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package-lock.json 是在 Windows 上生成的，npm 会把它认作“非本平台”的 optional
      # 原生绑定裁掉（npm/cli#4828），于是 Linux runner 上 rollup 找不到
      # @rollup/rollup-linux-x64-gnu，直接 Cannot find module。
      # 这里按已装版本号把缺的补回来；在 Linux 上删锁重装可以永久解决。
      - name: Add missing linux native bindings
        run: |
          set -e
          ROLLUP_V=$(node -e "console.log(require('./node_modules/rollup/package.json').version)")
          DEPS="@rollup/rollup-linux-x64-gnu@${ROLLUP_V}"
          if [ -f node_modules/lightningcss/package.json ]; then
            LIGHT_V=$(node -e "console.log(require('./node_modules/lightningcss/package.json').version)")
            DEPS="$DEPS lightningcss-linux-x64-gnu@${LIGHT_V}"
          fi
          npm i --no-save --no-audit --no-fund $DEPS
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native binding ok')"

      - name: Generate static site
        run: npm run generate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
