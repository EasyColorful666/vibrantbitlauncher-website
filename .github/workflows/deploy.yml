name: Deploy to GitHub Pages

# 触发来源
#   1. push（master / main）—— 本仓库改代码，常规部署
#   2. schedule —— 定时轮询上游 CHANGELOG.md，内容真变了才构建，不变只跑一次轻量检测
#   3. repository_dispatch(changelog-updated) —— 启动器仓库推 CHANGELOG.md 后即时部署
#      （可选加速通道，需要 PAT，配置方法见文件末尾注释）
#   4. workflow_dispatch —— 手动触发
#
# 注意：GitHub 原生不支持「监听另一个仓库的 push」，所以 2 和 3 是唯一的两条路。
on:
  push:
    branches: [master, main]
  repository_dispatch:
    types: [changelog-updated]
  schedule:
    # GitHub 的 cron 只有 UTC。00/06/12/18 点过 17 分 = 北京时间 08:17 / 14:17 / 20:17 / 次日 02:17。
    # 每 6 小时探一次：检测本身只跑 checkout + 一次 API 请求，真正构建只在上游内容变化时发生。
    - cron: '17 */6 * * *'
  workflow_dispatch:

# GITHUB_TOKEN 需要这几项才能发布 Pages：
#   pages: write   → 读取 / 更新 Pages 站点，并把产物挂上去
#   id-token: write → deploy-pages 的 OIDC 校验
permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 站点更新日志的来源：CHANGELOG.md 所在的仓库与分支
  UPSTREAM_REPO: EasyColorful666/VibrantbitLauncher.Avalonia
  UPSTREAM_REF: master

# 已绑定自定义域名 vbl.easycolorful.cn，站点挂在根路径，baseURL 用默认的 '/'。
# 如果哪天去掉自定义域名、退回 https://<user>.github.io/<repo>/，把下面两行加回来：
# env:
#   NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

# 同一时间只跑一个发布，不要中途取消，避免线上站点被半成品覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 先单独判断上游 CHANGELOG.md 有没有真变化。
  # 定时任务每天跑 4 次，没有这一步等于每次都要完整构建一遍内容相同的站点。
  changelog:
    name: Detect upstream CHANGELOG
    # 只有定时任务和跨仓库通知需要先探路；本仓库 push / 手动触发无论如何都要发布，
    # 直接跳到 build，省一次 checkout + 一次 API 请求。
    if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CHANGELOG.md from launcher repo
        run: |
          set -euo pipefail
          # 留一份已提交的版本作为比较基准
          cp assets/data/changelog.json "$RUNNER_TEMP/prev.json"
          # 走 contents API 而不是 raw.githubusercontent.com：raw 有 CDN 缓存，
          # 刚推完几分钟内可能还是旧内容，定时任务会误判成「没变化」。
          if curl -fsSL --retry 3 --retry-delay 2 \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               "https://api.github.com/repos/${UPSTREAM_REPO}/contents/CHANGELOG.md?ref=${UPSTREAM_REF}" \
               -o "$RUNNER_TEMP/CHANGELOG.md"; then
            CHANGELOG_PATH="$RUNNER_TEMP/CHANGELOG.md" node scripts/build-changelog.mjs
          else
            echo "::warning::拉取上游 CHANGELOG.md 失败，本次沿用仓库里已提交的 changelog.json"
          fi

      - name: Fetch releases from launcher repo
        run: |
          set -euo pipefail
          # 同样留一份基准。就算下面拉取失败，后续比较结果也会是「没变化」，
          # 不会误触发一次构建。
          cp assets/data/releases.json "$RUNNER_TEMP/prev-releases.json"
          if curl -fsSL --retry 3 --retry-delay 2 \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=100" \
               -o "$RUNNER_TEMP/release-latest.json"; then
            RELEASE_JSON="$RUNNER_TEMP/release-latest.json" node scripts/build-releases.mjs
          else
            echo "::warning::拉取 Release 列表失败，本次沿用仓库里已提交的 releases.json"
          fi

      - id: diff
        name: Compare with committed data files
        run: |
          set -euo pipefail
          # 两个文件都只比「内容」，剔除每次生成都会变的字段：
          #   changelog.json → generatedAt（时间戳）、source（临时路径）
          #   releases.json  → generatedAt、source
          # releases.json 整份比（而不只是 tag）：历史版本列表里多一条、少一条，
          # 或者某个文件的大小变了，页面上都该重新生成一次。
          CHANGED=$(node -e '
            const fs = require("fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const changelogBody = (p) => {
              const j = read(p);
              return JSON.stringify([j.count, j.releases]);
            };
            const releasesBody = (p) => {
              const j = read(p);
              delete j.generatedAt;
              delete j.source;
              return JSON.stringify(j);
            };
            const changed =
              changelogBody(process.argv[1]) !== changelogBody(process.argv[2]) ||
              releasesBody(process.argv[3]) !== releasesBody(process.argv[4]);
            console.log(changed ? "true" : "false");
          ' "$RUNNER_TEMP/prev.json" assets/data/changelog.json \
            "$RUNNER_TEMP/prev-releases.json" assets/data/releases.json)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "上游有变化：$CHANGED"

  build:
    needs: changelog
    # ⚠️ 这里的 always() 不能删。
    # 只要 depends 的 job 被跳过，GitHub 就会把依赖它的 job 一起跳过——即使 if 里
    # 明明写了 needs.changelog.result == 'skipped'。不加状态函数时，job 级 if 会被
    # 隐式当成 success() && (...)，而「上游 job 被跳过」不算 success，于是 push /
    # 手动触发（探测 job 必然跳过）连 build 都进不去，整条流水线 2 秒结束、状态 Skipped。
    # always() 是状态函数，能阻止这个隐式 success()，后面的条件才真正生效。
    #
    # 探测 job 被跳过（本仓库 push / 手动触发）→ 直接构建；
    # 探测跑了且上游内容有变化 → 构建；没变化 → 整个 workflow 到此为止。
    if: >-
      always() && (
        needs.changelog.result == 'skipped' ||
        needs.changelog.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先探一下 Pages 有没有启用，没有就立刻失败并给出人话提示，
      # 免得等 npm ci + 构建跑完才在 configure-pages 报一句 Not Found。
      # 注意：GITHUB_TOKEN 没有创建 Pages 站点的权限（configure-pages 的
      # enablement: true 会 403 Resource not accessible by integration），
      # 这一步只能由人在 Settings 里点一次。
      - name: Check Pages is enabled
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GET /repos/${{ github.repository }}/pages -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::仓库还没启用 Pages。打开 Settings → Pages → Build and deployment → Source，选「GitHub Actions」，再重新跑这个 workflow。私库需要 Pro/Team/Enterprise 套餐才有 Pages。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package-lock.json 是在 Windows 上生成的，npm 会把它认作“非本平台”的 optional
      # 原生绑定裁掉（npm/cli#4828），于是 Linux runner 上 rollup 找不到
      # @rollup/rollup-linux-x64-gnu，直接 Cannot find module。
      # 这里按已装版本号把缺的补回来；在 Linux 上删锁重装可以永久解决。
      - name: Add missing linux native bindings
        run: |
          set -e
          ROLLUP_V=$(node -e "console.log(require('./node_modules/rollup/package.json').version)")
          DEPS="@rollup/rollup-linux-x64-gnu@${ROLLUP_V}"
          if [ -f node_modules/lightningcss/package.json ]; then
            LIGHT_V=$(node -e "console.log(require('./node_modules/lightningcss/package.json').version)")
            DEPS="$DEPS lightningcss-linux-x64-gnu@${LIGHT_V}"
          fi
          npm i --no-save --no-audit --no-fund $DEPS
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native binding ok')"

      # 真正把上游 CHANGELOG.md 拉下来覆盖 assets/data/changelog.json，
      # 否则触发归触发，构建出来的站点还是上次的内容。
      # 这里不做强制失败：上游临时 4xx/5xx 不该让整个站点发不出去，
      # 退化成「用仓库里已有的 changelog.json 发布」，warning 会在 Actions 里标黄。
      - name: Sync CHANGELOG.md from launcher repo
        run: |
          set -uo pipefail
          if curl -fsSL --retry 3 --retry-delay 2 \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.raw" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               "https://api.github.com/repos/${UPSTREAM_REPO}/contents/CHANGELOG.md?ref=${UPSTREAM_REF}" \
               -o "$RUNNER_TEMP/CHANGELOG.md"; then
            CHANGELOG_PATH="$RUNNER_TEMP/CHANGELOG.md" node scripts/build-changelog.mjs
          else
            echo "::warning::拉取上游 CHANGELOG.md 失败，本次沿用仓库里已提交的 changelog.json"
          fi

      # 同上，下载弹窗里的直链和加速链接都要指向真实的 Release，历史版本列表
      # 也要跟着更新；拿不到就沿用仓库里已提交的 releases.json，不让整个发布挂掉。
      - name: Sync releases from launcher repo
        run: |
          set -uo pipefail
          if curl -fsSL --retry 3 --retry-delay 2 \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=100" \
               -o "$RUNNER_TEMP/release-latest.json"; then
            RELEASE_JSON="$RUNNER_TEMP/release-latest.json" node scripts/build-releases.mjs
          else
            echo "::warning::拉取 Release 列表失败，本次沿用仓库里已提交的 releases.json"
          fi

      - name: Generate static site
        run: npm run generate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    # 同样必须带 always()。changelog 被跳过时，跳过状态会沿着 needs 链一路传到
    # deploy——哪怕中间的 build 已经成功，只要 if 里没有状态函数，它就被当成
    # success() && (...) 而整条链路上有一个 skipped 就判 false，deploy 直接跳过。
    # 显式写 needs.build.result == 'success'：build 真的跑成功了才发布，
    # 定时任务判定「上游没变化」导致 build 被跳过时，deploy 也安静跳过。
    if: >-
      always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ---------------------------------------------------------------------------
# 可选：让启动器仓库「推了 CHANGELOG.md 就立刻通知本站」（不等定时任务）。
# 不做也能用，最迟 6 小时内站点会跟上。要做的话在启动器仓库里加两样东西：
#
# 1. 生成 PAT（classic：勾 repo；或 fine-grained：只给本站仓库
